<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading state -->
    <div id="loading" class="loading-state">
        <div class="breathing-circle"></div>
        <p class="loading-text" id="loadingText">Preparing your focus session</p>
    </div>
    
    <!-- Main app -->
    <div id="app" class="app hidden">
        <!-- Single unified view -->
        <main class="focus-view">
            <!-- Top info bar -->
            <div class="info-bar">
                <div class="time-display" id="timeDisplay">25:00</div>
                <div class="focus-score" id="focusScore">100</div>
            </div>
            
            <!-- Focus visualization -->
            <div class="focus-container">
                <video id="webcam" class="webcam-feed" autoplay playsinline></video>
                <canvas id="focusCanvas" class="focus-canvas"></canvas>
                
                <!-- Minimal progress ring -->
                <svg class="progress-ring" width="400" height="400">
                    <circle class="ring-bg" cx="200" cy="200" r="190"></circle>
                    <circle class="ring-progress" cx="200" cy="200" r="190"></circle>
                </svg>
            </div>
            
            <!-- Minimal controls -->
            <div class="controls-bar">
                <button id="actionBtn" class="primary-btn" data-state="ready">
                    <span class="btn-text">Begin Focus</span>
                </button>
                
                <button id="timeBtn" class="time-btn">25 min</button>
                
                <!-- Time selector (hidden by default) -->
                <div id="timeSelector" class="time-selector hidden">
                    <button class="time-option" data-minutes="15">15</button>
                    <button class="time-option" data-minutes="25">25</button>
                    <button class="time-option" data-minutes="45">45</button>
                    <button class="time-option" data-minutes="60">60</button>
                </div>
            </div>
            
            <!-- Status text -->
            <p id="statusText" class="status-text">Click to set your focus time</p>
            
            <!-- Controls group at bottom right -->
            <div class="controls-group">
                <div class="music-controls">
                    <button id="musicToggle" class="music-toggle" title="Toggle background music">🔇</button>
                    <input type="range" id="musicVolume" class="music-volume" min="0" max="100" value="30" title="Music volume">
                </div>
                <div class="action-controls">
                    <!-- <button id="feedbackBtn" class="control-btn" title="Give feedback">💬</button> -->
                    <button id="webcamToggle" class="webcam-toggle" title="Toggle webcam visibility">👁</button>
                </div>
            </div>
        </main>
        
        <!-- Audio elements -->
        <audio id="backgroundMusic" loop preload="auto">
            <source src="cicada.mp3" type="audio/mpeg">
        </audio>
        
        <!-- Completion view -->
        <div id="completion" class="completion-view hidden">
            <div class="completion-content">
                <div class="completion-score" id="completionScore">92</div>
                <h2 class="completion-title">Focus Complete</h2>
                <p class="completion-time" id="completionTime">25 minutes of deep focus</p>
                
                <!-- Feedback form -->
                <div class="feedback-form">
                    <h3 class="feedback-title">How was your session?</h3>
                    <div class="rating-stars">
                        <button class="star" data-rating="1">☆</button>
                        <button class="star" data-rating="2">☆</button>
                        <button class="star" data-rating="3">☆</button>
                        <button class="star" data-rating="4">☆</button>
                        <button class="star" data-rating="5">☆</button>
                    </div>
                    <textarea id="feedbackText" class="feedback-textarea" placeholder="Share your thoughts about this session (optional)..." rows="3"></textarea>
                    <div class="feedback-actions">
                        <button id="skipFeedback" class="skip-btn">Skip</button>
                        <button id="submitFeedback" class="submit-btn">Submit</button>
                    </div>
                </div>
                
                <button id="newSessionBtn" class="primary-btn hidden">New Session</button>
            </div>
        </div>
        
        <!-- Product Feedback Modal -->
        <div id="productFeedbackModal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Share Your Feedback</h3>
                    <button id="closeFeedbackModal" class="close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <p>Help us improve Focus! Your feedback matters.</p>
                    <div class="product-rating-stars">
                        <button class="product-star" data-rating="1">☆</button>
                        <button class="product-star" data-rating="2">☆</button>
                        <button class="product-star" data-rating="3">☆</button>
                        <button class="product-star" data-rating="4">☆</button>
                        <button class="product-star" data-rating="5">☆</button>
                    </div>
                    <textarea id="productFeedbackText" class="product-feedback-textarea" placeholder="What do you think about Focus? Any suggestions or improvements?" rows="4"></textarea>
                </div>
                <div class="modal-footer">
                    <button id="submitProductFeedback" class="submit-btn">Submit Feedback</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <script src="script.js"></script>
</body>
</html>
