<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Buddy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>AI Study Buddy</h1>
        
        <!-- Loading screen -->
        <div id="loading">
            <h2>Loading AI Study Buddy...</h2>
            <div class="loading-info">
                <p>Camera access will be requested to track your focus</p>
                <p>This app uses your webcam for face tracking only - no images are stored</p>
            </div>
            <div class="loading-spinner"></div>
        </div>
        
        <!-- Main app content (hidden until loaded) -->
        <div id="appContent" class="hidden">
            <!-- Centered layout -->
            <div class="main-layout">
                <div class="webcam-container">
                    <video id="webcam" autoplay playsinline></video>
                </div>
                
                <div class="face-container">
                    <canvas id="faceCanvas"></canvas>
                </div>
                
                <div class="status-container">
                    <p id="status">Getting ready...</p>
                    <div class="controls">
                        <button id="mainActionButton">Start Monitoring</button>
                        <button id="resetButton">Reset</button>
                    </div>
                </div>
            </div>
            
            <!-- Simple instruction -->
            <div class="instruction">
                <p>The face will track your head movement and smile when you smile!</p>
            </div>
        </div>
        
        <!-- Audio context will be created in JavaScript -->
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <script src="script.js"></script>
</body>
</html>
