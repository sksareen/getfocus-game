<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading state -->
    <div id="loading" class="loading-state">
        <div class="breathing-circle"></div>
        <p class="loading-text">Preparing your focus session</p>
    </div>
    
    <!-- Main app -->
    <div id="app" class="app hidden">
        <!-- Single unified view -->
        <main class="focus-view">
            <!-- Focus visualization -->
            <div class="focus-container">
                <video id="webcam" class="webcam-feed" autoplay playsinline></video>
                <canvas id="focusCanvas" class="focus-canvas"></canvas>
                
                <!-- Minimal progress ring -->
                <svg class="progress-ring" width="400" height="400">
                    <circle class="ring-bg" cx="200" cy="200" r="190"></circle>
                    <circle class="ring-progress" cx="200" cy="200" r="190"></circle>
                </svg>
                
                <!-- Center info -->
                <div class="focus-info">
                    <div class="time-display" id="timeDisplay">25:00</div>
                    <div class="focus-score" id="focusScore">100</div>
                </div>
            </div>
            
            <!-- Minimal controls -->
            <div class="controls-bar">
                <button id="actionBtn" class="primary-btn" data-state="ready">
                    <span class="btn-text">Begin Focus</span>
                </button>
                
                <!-- Time selector (hidden by default) -->
                <div id="timeSelector" class="time-selector hidden">
                    <button class="time-option" data-minutes="15">15</button>
                    <button class="time-option" data-minutes="25">25</button>
                    <button class="time-option" data-minutes="45">45</button>
                    <button class="time-option" data-minutes="60">60</button>
                </div>
            </div>
            
            <!-- Status text -->
            <p id="statusText" class="status-text">Click to set your focus time</p>
        </main>
        
        <!-- Completion view -->
        <div id="completion" class="completion-view hidden">
            <div class="completion-content">
                <div class="completion-score" id="completionScore">92</div>
                <h2 class="completion-title">Focus Complete</h2>
                <p class="completion-time" id="completionTime">25 minutes of deep focus</p>
                <button id="newSessionBtn" class="primary-btn">New Session</button>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <script src="script.js"></script>
</body>
</html>
